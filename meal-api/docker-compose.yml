services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meals
      POSTGRES_USER: meals
      POSTGRES_PASSWORD: meals
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meals"]
      interval: 5s

  api:
    build: .
    command: ["api"]
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://meals:meals@postgres:5432/meals

volumes:
  pgdata:
